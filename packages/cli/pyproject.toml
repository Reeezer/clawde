[project]
name = "clawde-cli"
version = "0.0.1"
description = "clawde CLI — the interactive terminal interface for the clawde agent."
requires-python = ">=3.12"
dependencies = [
    "clawde-core",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
clawde = "clawde_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawde_cli"]

[tool.uv]
package = true

[tool.uv.sources]
clawde-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false  # typer's @app.command / @app.callback decorators
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clawde_cli --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["clawde_cli"]
omit = ["*/__main__.py"]  # `python -m clawde_cli` shim — exercised by hand, not in tests

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
