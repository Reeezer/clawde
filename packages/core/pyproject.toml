[project]
name = "clawde-core"
version = "0.0.1"
description = "clawde core — the bring-your-own-model agent engine (loop, providers, tools, context)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Pure-Python JSON-Schema validator used to check tool-call arguments before
    # dispatch (tools/base.py). Not a model SDK — it is import-clean and offline,
    # so it lives in the base deps and is imported at module top (see ADR-0003).
    "jsonschema>=4.20",
]

[project.optional-dependencies]
# BYOM provider SDKs are optional extras, imported lazily inside each provider
# implementation (see ADR-0003) so the base install stays light and the offline
# path stays import-clean. Ollama / OpenAI-compatible endpoints are reached over
# plain HTTP and need no extra.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawde_core"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=clawde_core --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: hits a real provider API (needs a key); deselected by default",
]

[tool.coverage.run]
source = ["clawde_core"]

[tool.coverage.report]
exclude_also = [
    # Never executed at runtime — type-checker only.
    "if TYPE_CHECKING:",
    # Abstract method bodies are stubs; the subclass is what runs.
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # Type stubs for the (otherwise untyped) jsonschema runtime dep, for mypy
    # --strict. Dev-only: the base wheel needs only jsonschema itself.
    "types-jsonschema>=4.20",
    # Installed for tests only: each provider lazy-imports its SDK at runtime
    # (optional extras), but the offline test suite imports them to fake the
    # client and exercise message/tool conversion without a network call. Not
    # runtime dependencies — the base wheel stays SDK-free (ADR-0003).
    "google-genai>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
]
